<div class="container my-5 pt-5">
  <div class="mb-4">
    <a routerLink="/home" class="btn btn-link text-decoration-none text-muted p-0">
      <i class="bi bi-arrow-left"></i> ← Back to Shop
    </a>
  </div>

  @if (product()) {
    <div class="row g-5 align-items-center">
      <div class="col-md-6">
        <div class="product-img-wrapper shadow-sm rounded-4 bg-white p-5 text-center">
          <img [src]="product().image" [alt]="product().title" class="img-fluid main-img">
        </div>
      </div>

      <div class="col-md-6">
        <span class="badge bg-light text-primary px-3 py-2 rounded-pill mb-2 border">
          {{ product().category }}
        </span>
        <h1 class="display-6 fw-bold mb-3 text-dark">{{ product().title }}</h1>
        
        <div class="d-flex align-items-center mb-4">
          <h2 class="text-success fw-bold mb-0 me-3 fs-1">{{ product().price | currency }}</h2>
          <div class="text-warning fs-5">
            ⭐ {{ product().rating?.rate }} <span class="text-muted fs-6">({{ product().rating?.count }} reviews)</span>
          </div>
        </div>

        <p class="lead text-secondary mb-5 line-height-lg">
          {{ product().description }}
        </p>

        <div class="d-flex gap-3 mt-auto">
          <button (click)="addToCart()" class="btn btn-primary btn-lg px-5 py-3 rounded-pill shadow-lg flex-grow-1">
            Add to Cart 🛒
          </button>
          <button class="btn btn-outline-danger btn-lg rounded-circle px-3">
            ❤
          </button>
        </div>
      </div>
    </div>
  } @else {
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="mt-3">Loading product details...</p>
    </div>
  }
</div>
