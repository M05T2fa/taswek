<div class="container mt-5 pt-5">
  
  <div class="row mb-4 justify-content-center text-center">
    <div class="col-md-8 col-lg-6">
      <h2 class="fw-bold mb-4">Find Your Style <span class="text-primary">.</span></h2>
      <div class="search-wrapper shadow-sm rounded-pill d-flex align-items-center bg-white border px-3">
        <span class="text-muted">🔍</span>
        <input 
          type="text" 
          class="form-control border-0 shadow-none py-3" 
          placeholder="Search products..."
          (input)="onSearch($event)">
      </div>
    </div>
  </div>

  <div class="d-flex justify-content-center flex-wrap gap-2 mb-5">
    @for (cat of categories; track cat) {
      <button 
        (click)="setCategory(cat)"
        [class.active-cat]="selectedCategory() === cat"
        class="btn category-btn rounded-pill px-4 py-2 text-capitalize shadow-sm">
        {{ cat }}
      </button>
    }
  </div>

  <div class="row g-4">
    @for (product of filteredProducts(); track product.id) {
      <div class="col-sm-6 col-md-4 col-lg-3">
        <div class="card h-100 shadow-sm border-0 p-3 rounded-4 custom-card">
          <div class="img-container p-3 text-center">
            <img [src]="product.image" class="card-img-top" [alt]="product.title">
          </div>
          <div class="card-body d-flex flex-column text-center">
            <h6 class="card-title text-truncate fw-bold mb-2">{{ product.title }}</h6>
            <p class="text-muted small mb-2">{{ product.category }}</p>
            <h5 class="text-primary fw-bold mb-3 mt-auto">{{ product.price | currency }}</h5>
            
            <div class="d-grid gap-2">
              <button (click)="addToCart(product)" class="btn btn-primary rounded-pill py-2">Add to Cart</button>
              <a [routerLink]="['/product', product.id]" class="btn btn-outline-dark btn-sm rounded-pill border-0">Details</a>
            </div>
          </div>
        </div>
      </div>
    } @empty {
      <div class="text-center py-5">
        <h3 class="text-muted">No products found matching your search 😢</h3>
      </div>
    }
  </div>
</div>
