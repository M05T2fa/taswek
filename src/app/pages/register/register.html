<div class="container d-flex justify-content-center align-items-center" style="min-height: 90vh;">
  <div class="card shadow p-4" style="width: 450px; border-radius: 20px; border: none;">
    <h2 class="text-center fw-bold mb-4 text-primary">Create Account</h2>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      
      <div class="mb-3">
        <label class="form-label fw-semibold">Full Name</label>
        <input type="text" class="form-control shadow-sm" formControlName="userName" placeholder="John Doe">
        <small class="text-danger" *ngIf="registerForm.get('userName')?.touched && registerForm.get('userName')?.invalid">
          Please enter at least 3 letters.
        </small>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold">Email address</label>
        <input type="email" class="form-control shadow-sm" formControlName="email" placeholder="name@example.com">
        <small class="text-danger" *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.errors?.['email']">
          Please enter a valid email address.
        </small>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" class="form-control shadow-sm" formControlName="password" placeholder="******">
        <small class="text-danger" *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.errors?.['minlength']">
          The password is weak (minimum 6 characters).
        </small>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg shadow" [disabled]="registerForm.invalid">
        Sign Up
      </button>

      <p class="text-center mt-3 text-muted">
        Already have an account? <a routerLink="/login" class="text-decoration-none">Login</a>
      </p>
    </form>
  </div>
</div>
