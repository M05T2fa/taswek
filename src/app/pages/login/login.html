<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow p-4" style="width: 400px; border-radius: 15px;">
    <h2 class="text-center mb-4">Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-3">
        <label class="form-label">Email address</label>
        <input type="email" class="form-control" formControlName="email" placeholder="name@example.com">
        <small class="text-danger" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.errors?.['email']">
 The email address is incorrect!
        </small>
      </div>

      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" formControlName="password">
        <small class="text-danger" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.errors?.['minlength']">
          The password must be more than 6 characters long!
        </small>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg" [disabled]="loginForm.invalid">
        Login
      </button>
    </form>
  </div>
</div>
